services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: adi
      POSTGRES_PASSWORD: adi
      POSTGRES_DB: adi
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["${ADI_DB_HOST_PORT:-5434}:5432"]  # host port only for psql/GUI access; backend uses the internal network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adi"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    environment:
      ADI_DATABASE_URL: postgresql+psycopg://adi:adi@db:5432/adi
    volumes: [docstore:/data]
    depends_on:
      db: { condition: service_healthy }
    ports: ["8000:8000"]

  frontend:
    build: ./frontend
    depends_on: [backend]
    ports: ["8080:80"]

volumes:
  pgdata:
  docstore:
